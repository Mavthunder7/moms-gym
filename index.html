<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#f7f8fc">
<title>Mom's Gym</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#172033;--muted:#687386;--line:#e7eaf0;--accent:#6d5dfc;--soft:#f0eeff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:14px 14px 34px}
.header{padding:9px 3px 17px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:var(--muted)}h1{font-size:29px;margin:3px 0 4px;letter-spacing:-.6px}.header p{margin:0;color:var(--muted);font-size:14px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:15px;position:sticky;top:0;padding:4px 0 10px;background:var(--bg);z-index:5}
.day{border:0;border-radius:15px;background:#fff;padding:12px 3px;font-weight:900;color:var(--muted);box-shadow:0 4px 16px rgba(20,30,60,.06)}.day.active{background:var(--text);color:#fff}
.summary{background:var(--soft);border-radius:19px;padding:14px 15px;margin-bottom:13px}.summary strong{display:block;font-size:18px}.summary span{font-size:13px;color:#596477}
.card{background:var(--card);border-radius:23px;overflow:hidden;box-shadow:0 9px 27px rgba(20,30,60,.08);margin-bottom:13px}
.video{background:#000;aspect-ratio:16/9}.video iframe{width:100%;height:100%;border:0;display:block}
.content{padding:17px}.num{font-size:12px;font-weight:900;color:var(--accent);margin-bottom:2px}h2{font-size:23px;margin:0 0 10px;letter-spacing:-.4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{background:#f0f2f6;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}
.note{font-size:13px;line-height:1.5;color:#5b6677;margin:13px 0}
.sets{display:grid;gap:8px}.set{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:14px;font-weight:800;font-size:13px}.set input{width:20px;height:20px;accent-color:var(--accent)}
.progress{margin-top:10px;background:var(--soft);border-radius:13px;padding:10px;text-align:center;font-size:12px;font-weight:900}
.rest{width:100%;margin-top:9px;border:0;border-radius:13px;padding:11px;background:#eef1f5;font-weight:900;color:var(--text)}
.notice{margin-top:15px;padding:13px;border-radius:15px;background:#fff7e8;color:#765116;font-size:11px;line-height:1.45}
footer{text-align:center;color:#9aa3b2;font-size:11px;line-height:1.45;padding:8px 5px 0}
@media(max-width:370px){.day{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="eyebrow">Simple 5-day gym guide</div>
  <h1>Mom's Gym 💪</h1>
  <p>Tap a day, watch the exercise, then check off the sets.</p>
</header>
<nav class="days">
  <button class="day active" data-day="monday">MON</button>
  <button class="day" data-day="tuesday">TUE</button>
  <button class="day" data-day="wednesday">WED</button>
  <button class="day" data-day="thursday">THU</button>
  <button class="day" data-day="friday">FRI</button>
</nav>
<main id="app"></main>
<footer>Warm up 8–10 minutes with easy walking. Choose a comfortable weight and use controlled movement. Stop for sharp or unusual pain. General fitness information only.</footer>
</div>

<script>
const DATA={"monday": {"label": "Monday", "focus": "Legs + Glutes", "exercises": [["Leg Press", "3", "10\u201312", "60\u201390 sec", "youtube", "COeP5FmdxJI", "Use a comfortable weight. Keep your back supported and move in a controlled way."], ["Leg Extension", "2", "12", "60\u201390 sec", "youtube", "0fl1RRgJ83I", "Set the seat so the knee lines up with the machine pivot. Use a controlled range."], ["Leg Curl", "3", "10\u201312", "60\u201390 sec", "vimeo", "877881471", "Keep the movement slow and controlled. Pause briefly as the heels come toward the glutes."], ["Hip Abduction", "2", "15", "45\u201360 sec", "youtube", "7pbZA7ncuq8", "Sit upright with your back supported. Open the pads under control and return slowly."], ["Calf Raise", "2", "12\u201315", "45\u201360 sec", "youtube", "RBslMmWqzzE", "Use a comfortable range and avoid bouncing."], ["Treadmill", "\u2014", "15\u201320 min", "\u2014", "youtube", "r9WxlGE89xY", "Easy to brisk walking. Adjust pace and incline to a comfortable level."]]}, "tuesday": {"label": "Tuesday", "focus": "Upper Body + Cardio", "exercises": [["Chest Press", "3", "10\u201312", "60\u201390 sec", "youtube", "tier5tDPNfE", "Keep your back supported and press smoothly without locking the elbows."], ["Lat Pulldown", "3", "10\u201312", "60\u201390 sec", "youtube", "iKrKgWR9wbY", "Pull toward the upper chest with control. Avoid swinging your body."], ["Seated Row", "3", "10\u201312", "60\u201390 sec", "youtube", "vwHG9Jfu4sw", "Keep your spine neutral and pull the handle toward your torso without jerking."], ["Shoulder Press", "2", "10\u201312", "60\u201390 sec", "youtube", "D1S98d47kjo", "Adjust the seat so the handles start around shoulder height. Press smoothly."], ["Biceps Curl", "2", "12", "45\u201360 sec", "vimeo", "760001918", "Keep your upper arms supported and curl without swinging."], ["Triceps Pushdown", "2", "12", "45\u201360 sec", "youtube", "FlDbtq9sFjA", "Keep elbows close to your sides and move the forearms under control."]]}, "wednesday": {"label": "Wednesday", "focus": "Cardio + Core + Recovery", "exercises": [["Treadmill", "\u2014", "30\u201340 min", "\u2014", "youtube", "r9WxlGE89xY", "Walk at a comfortable pace. You do not need to match the video's pace."], ["Stationary Bike", "\u2014", "15\u201320 min", "\u2014", "youtube", "rEqRmKAQ5xM", "Keep the resistance comfortable and use an easy-to-moderate pace."], ["Abdominal Machine", "2", "12", "45\u201360 sec", "youtube", "dga4q8NAwOg", "Use light resistance and focus on a controlled crunch rather than pulling with your arms."], ["Bird Dog", "2", "8/side", "45\u201360 sec", "youtube", "GlOpvsoCzeU", "Keep your spine neutral. Reach opposite arm and leg without twisting."], ["Gentle Stretching", "\u2014", "5\u201310 min", "\u2014", "youtube", "ng3Q_DsTbC4", "Move gently and never force a stretch. Breathe slowly."]]}, "thursday": {"label": "Thursday", "focus": "Legs + Glutes + Hamstrings", "exercises": [["Leg Press", "3", "10\u201312", "60\u201390 sec", "youtube", "COeP5FmdxJI", "Use a comfortable weight and controlled range of motion."], ["Leg Curl", "3", "10\u201312", "60\u201390 sec", "vimeo", "877881471", "Control both the curl and the return."], ["Leg Extension", "2", "12", "60\u201390 sec", "youtube", "0fl1RRgJ83I", "Use a comfortable weight and avoid forcing the knee."], ["Hip Abduction", "2", "15", "45\u201360 sec", "youtube", "7pbZA7ncuq8", "Keep the movement controlled rather than using momentum."], ["Calf Raise", "2", "15", "45\u201360 sec", "youtube", "RBslMmWqzzE", "Rise and lower smoothly; avoid bouncing."], ["Treadmill", "\u2014", "20 min", "\u2014", "youtube", "r9WxlGE89xY", "Easy-to-moderate walking for the planned time."]]}, "friday": {"label": "Friday", "focus": "Upper Body + Cardio", "exercises": [["Chest Press", "2", "10\u201312", "60\u201390 sec", "youtube", "tier5tDPNfE", "Press smoothly with your back supported."], ["Lat Pulldown", "2", "10\u201312", "60\u201390 sec", "youtube", "iKrKgWR9wbY", "Keep your torso stable and pull with control."], ["Seated Row", "2", "10\u201312", "60\u201390 sec", "youtube", "vwHG9Jfu4sw", "Keep the spine neutral and avoid swinging."], ["Shoulder Press", "2", "10\u201312", "60\u201390 sec", "youtube", "D1S98d47kjo", "Use a comfortable load and controlled repetitions."], ["Biceps Curl", "2", "12", "45\u201360 sec", "vimeo", "760001918", "Keep the upper arms supported and control the lowering phase."], ["Triceps Pushdown", "2", "12", "45\u201360 sec", "youtube", "FlDbtq9sFjA", "Keep elbows close to your sides and avoid leaning into the movement."], ["Treadmill", "\u2014", "20\u201325 min", "\u2014", "youtube", "r9WxlGE89xY", "Walk at a comfortable pace for the planned time."]]}};
const app=document.getElementById('app');
const tabs=[...document.querySelectorAll('.day')];
let restTimer=null;

function videoUrl(type,id){
  if(type==='vimeo') return `https://player.vimeo.com/video/${id}?title=0&byline=0&portrait=0`;
  return `https://www.youtube.com/embed/${id}?rel=0&playsinline=1`;
}

function render(dayKey){
  const day=DATA[dayKey];
  let html=`<div class="summary"><strong>${day.label} • ${day.focus}</strong><span>${day.exercises.length} planned items</span></div>`;
  day.exercises.forEach((e,i)=>{
    const [name,sets,reps,rest,type,id,note]=e;
    const hasSets=sets!=='—';
    const setHtml=hasSets ? `<div class="sets">${Array.from({length:Number(sets)},(_,j)=>`<label class="set"><input type="checkbox" data-day="${dayKey}" data-ex="${i}"> Set ${j+1} • ${reps} reps</label>`).join('')}</div><div class="progress" data-progress="${dayKey}-${i}">0 of ${sets} sets completed</div>` : '';
    const restHtml=rest!=='—' ? `<button class="rest" onclick="startRest(this, '${rest}')">⏱ Start ${rest} rest</button>` : '';
    html+=`<article class="card">
      <div class="video"><iframe src="${videoUrl(type,id)}" title="${name} demonstration" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
      <div class="content">
        <div class="num">Exercise ${i+1}</div>
        <h2>${name}</h2>
        <div class="pills">${hasSets?`<span class="pill">${sets} sets</span><span class="pill">${reps} reps</span>`:`<span class="pill">${reps}</span>`}${rest!=='—'?`<span class="pill">${rest} rest</span>`:''}</div>
        <p class="note">${note}</p>
        ${setHtml}${restHtml}
      </div>
    </article>`;
  });
  app.innerHTML=html;
  app.querySelectorAll('input[type=checkbox]').forEach(box=>box.addEventListener('change',updateProgress));
}

function updateProgress(e){
  const ex=e.target.dataset.ex, day=e.target.dataset.day;
  const boxes=[...app.querySelectorAll(`input[data-day="${day}"][data-ex="${ex}"]`)];
  const done=boxes.filter(x=>x.checked).length;
  const el=app.querySelector(`[data-progress="${day}-${ex}"]`);
  if(el) el.textContent=`${done} of ${boxes.length} sets completed`;
}

function startRest(btn,rest){
  clearInterval(restTimer);
  let n=parseInt(rest);
  btn.disabled=true;
  btn.textContent=`⏱ Rest: ${n}s`;
  restTimer=setInterval(()=>{
    n--; btn.textContent=n>0?`⏱ Rest: ${n}s`:'✓ Rest finished';
    if(n<=0){clearInterval(restTimer);btn.disabled=false;}
  },1000);
}

tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');
  render(t.dataset.day);scrollTo({top:0,behavior:'smooth'});
}));

render('monday');
</script>
</body>
</html>
